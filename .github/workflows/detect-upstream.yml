name: Detect Upstream Package Updates

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: detect-upstream-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-wechat-updates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Test upstream detection
        run: python3 -m unittest discover -s .github/tests -v

      - name: Detect upstream package changes
        id: detect
        run: ./.github/scripts/detect-upstream.sh

      - name: Commit updated version state
        if: steps.detect.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions/upstream.env
          git commit -m "chore: update upstream package state"
          git push

      # Pushes made with GITHUB_TOKEN do not trigger other push workflows.
      - name: Trigger Docker image build
        if: steps.detect.outputs.changed == 'true' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docker.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
