name: Build and Publish Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'versions/upstream.env'
      - 'Dockerfile'
      - '.dockerignore'
      - 'root/**'
      - '.github/tests/test-volume-migration.sh'
      - '.github/workflows/docker.yml'
    tags:
      - 'v*'

concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  DOCKERHUB_REGISTRY: docker.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: DOCKERHUB
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Select publish channel
      id: channel
      shell: bash
      run: |
        number='(0|[1-9][0-9]*)'
        version="v${number}\.${number}\.${number}"
        identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
        prerelease="${identifier}(\.${identifier})*"

        channel=build
        if [[ "$GITHUB_REF" == refs/heads/master ]]; then
          channel=edge
        elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/* ]]; then
          if [[ "$GITHUB_REF_NAME" =~ ^${version}$ ]]; then
            channel=stable
          elif [[ "$GITHUB_REF_NAME" =~ ^${version}-${prerelease}$ ]]; then
            channel=prerelease
          fi
        fi
        echo "name=$channel" >> "$GITHUB_OUTPUT"

    - name: Set up ARM64 emulation
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      if: steps.channel.outputs.name != 'build'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Login to Docker Hub
      if: steps.channel.outputs.name != 'build' && vars.ENABLE_DOCKERHUB == 'true'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.DOCKERHUB_REGISTRY }}
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ghcr.io/${{ github.repository }}
          ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }},enable=${{ vars.ENABLE_DOCKERHUB == 'true' }}
        flavor: |
          latest=false
        tags: |
          type=semver,pattern={{version}},enable=${{ steps.channel.outputs.name == 'stable' || steps.channel.outputs.name == 'prerelease' }}
          type=raw,value=edge,enable=${{ steps.channel.outputs.name == 'edge' }}

    - name: Load upstream version state
      run: |
        if [ -f versions/upstream.env ]; then
          grep -v '^#' versions/upstream.env | grep -v '^\s*$' | sed 's/"//g' >> "$GITHUB_ENV"
        fi

    - name: Build full Docker image
      id: build-image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: ${{ steps.channel.outputs.name != 'build' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          WECHAT_AMD64_URL=${{ env.WECHAT_AMD64_URL }}
          WECHAT_ARM64_URL=${{ env.WECHAT_ARM64_URL }}
          WECHAT_AMD64_SHA256=${{ env.WECHAT_AMD64_SHA256 }}
          WECHAT_ARM64_SHA256=${{ env.WECHAT_ARM64_SHA256 }}
          QQ_AMD64_URL=${{ env.QQ_AMD64_URL }}
          QQ_ARM64_URL=${{ env.QQ_ARM64_URL }}
          QQ_AMD64_SHA256=${{ env.QQ_AMD64_SHA256 }}
          QQ_ARM64_SHA256=${{ env.QQ_ARM64_SHA256 }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Extract metadata for minimal image
      id: meta-minimal
      uses: docker/metadata-action@v5
      with:
        images: |
          ghcr.io/${{ github.repository }}
          ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }},enable=${{ vars.ENABLE_DOCKERHUB == 'true' }}
        flavor: |
          latest=false
        tags: |
          type=semver,pattern={{version}},suffix=-minimal,enable=${{ steps.channel.outputs.name == 'stable' || steps.channel.outputs.name == 'prerelease' }}
          type=raw,value=edge-minimal,enable=${{ steps.channel.outputs.name == 'edge' }}

    - name: Build minimal Docker image
      id: build-minimal
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: ${{ steps.channel.outputs.name != 'build' }}
        tags: ${{ steps.meta-minimal.outputs.tags }}
        labels: ${{ steps.meta-minimal.outputs.labels }}
        build-args: |
          INSTALL_QQ=false
          INSTALL_PCMANFM=false
          WECHAT_AMD64_URL=${{ env.WECHAT_AMD64_URL }}
          WECHAT_ARM64_URL=${{ env.WECHAT_ARM64_URL }}
          WECHAT_AMD64_SHA256=${{ env.WECHAT_AMD64_SHA256 }}
          WECHAT_ARM64_SHA256=${{ env.WECHAT_ARM64_SHA256 }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Validate volume migration on release images
      if: steps.channel.outputs.name == 'stable'
      shell: bash
      env:
        FULL_DIGEST: ${{ steps.build-image.outputs.digest }}
        MINIMAL_DIGEST: ${{ steps.build-minimal.outputs.digest }}
      run: |
        repository="$REGISTRY/${IMAGE_NAME,,}"
        for digest in "$FULL_DIGEST" "$MINIMAL_DIGEST"; do
          image="$repository@$digest"
          docker pull --platform linux/amd64 "$image"
          bash .github/tests/test-volume-migration.sh "$image"
        done

    - name: Generate artifact attestation
      if: steps.channel.outputs.name != 'build' && github.event_name != 'workflow_dispatch'
      uses: actions/attest-build-provenance@v1
      with:
        subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        subject-digest: ${{ steps.build-image.outputs.digest }}
        push-to-registry: true

    - name: Promote stable Docker tags
      if: steps.channel.outputs.name == 'stable'
      shell: bash
      env:
        FULL_DIGEST: ${{ steps.build-image.outputs.digest }}
        MINIMAL_DIGEST: ${{ steps.build-minimal.outputs.digest }}
        FULL_VERSION: ${{ steps.meta.outputs.version }}
        ENABLE_DOCKERHUB: ${{ vars.ENABLE_DOCKERHUB }}
        DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
      run: |
        repositories=("$REGISTRY/${IMAGE_NAME,,}")
        if [[ "$ENABLE_DOCKERHUB" == true ]]; then
          repositories+=("$DOCKERHUB_REGISTRY/${DOCKERHUB_IMAGE,,}")
        fi
        major="${FULL_VERSION%%.*}"
        minor="${FULL_VERSION%.*}"

        # A single index source is copied as-is by imagetools.
        for repository in "${repositories[@]}"; do
          docker buildx imagetools create \
            --tag "$repository:latest" --tag "$repository:$major" --tag "$repository:$minor" \
            "$repository@$FULL_DIGEST"
          docker buildx imagetools create \
            --tag "$repository:minimal" --tag "$repository:$major-minimal" --tag "$repository:$minor-minimal" \
            "$repository@$MINIMAL_DIGEST"
        done

    - name: Output Docker image information
      if: steps.channel.outputs.name != 'build'
      run: |
        {
          echo "## 🐳 Docker Images Published"
          echo "### GitHub Container Registry"
          echo "**Registry:** ${{ env.REGISTRY }}"
          echo "**Repository:** ${{ env.IMAGE_NAME }}"
          echo "**Full image digest:** \`${{ steps.build-image.outputs.digest }}\`"
          echo "**Minimal image digest:** \`${{ steps.build-minimal.outputs.digest }}\`"
          echo "**Tags (full):**"
          echo "\`\`\`"
          echo "${{ steps.meta.outputs.tags }}"
          echo "\`\`\`"
          echo "**Tags (minimal):**"
          echo "\`\`\`"
          echo "${{ steps.meta-minimal.outputs.tags }}"
          echo "\`\`\`"

          if [ "${{ steps.channel.outputs.name }}" == "stable" ]; then
            echo "Stable aliases and major/minor version tags promoted after volume migration checks."
          fi

          if [ "${{ vars.ENABLE_DOCKERHUB }}" == "true" ]; then
            echo ""
            echo "### Docker Hub"
            echo "**Registry:** ${{ env.DOCKERHUB_REGISTRY }}"
            echo "**Repository:** ${{ github.repository }}"
            echo "**Digest:** \`${{ steps.build-image.outputs.digest }}\`"
            echo "**Tags:**"
            echo "\`\`\`"
            echo "${{ steps.meta.outputs.tags }}"
            echo "\`\`\`"
          else
            echo ""
            echo "### Docker Hub"
            echo "⚠️ **Skipped** - Docker Hub push disabled (set ENABLE_DOCKERHUB=true to enable)"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Create GitHub Release
      if: steps.channel.outputs.name == 'stable' || steps.channel.outputs.name == 'prerelease'
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        prerelease: ${{ steps.channel.outputs.name == 'prerelease' }}
        make_latest: ${{ steps.channel.outputs.name == 'stable' }}
        body: |
          ## 🐳 Docker Images
          
          ### Full (WeChat + QQ + File Manager)
          **GitHub Container Registry:**
          ```bash
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          ```
          
          ### Minimal (WeChat only)
          ```bash
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta-minimal.outputs.version }}
          ```
          
          ${{ vars.ENABLE_DOCKERHUB == 'true' && format('Docker Hub also provides `{0}/{1}:{2}` and `{0}/{1}:{3}`.', secrets.DOCKERHUB_USERNAME, github.event.repository.name, steps.meta.outputs.version, steps.meta-minimal.outputs.version) || '' }}

          Stable releases update the `latest` (full) and `minimal` aliases. The
          `edge` (full) and `edge-minimal` aliases follow builds from `master`.

          ## 🚀 Quick Start
          Create a `.env` file with a nonempty `PASSWORD`. The default username is `abc`.

          **Full:**
          ```bash
          docker run -it --env-file .env -p 3001:3001 -v ./config:/config ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          ```
          
          **Minimal:**
          ```bash
          docker run -it --env-file .env -p 3001:3001 -v ./config:/config ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta-minimal.outputs.version }}
          ```
          
          Then visit: https://localhost:3001
